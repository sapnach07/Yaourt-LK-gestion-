             L 320 160 
             L 300 380 
             C 298 396, 284 408, 268 408 
             L 244 408 
             C 228 408, 214 396, 212 380 
             Z" />

    <!-- Cuillère minimaliste intégrée sur le côté -->
    <path d="M 336 128 
             C 346 112, 366 112, 376 128 
             C 386 144, 376 168, 360 178 
             L 336 290 
             L 326 288 
             L 348 174 
             C 342 166, 338 152, 336 128 
